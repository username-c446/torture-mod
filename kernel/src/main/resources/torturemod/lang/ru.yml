help.console: "Справка открывается только в игре."
help.book.title: "Справка Torture Mod"
help.book.contents: "Оглавление"
help.book.back: "‹ к оглавлению"
help.maps_given: "Выдано карт: {0}. Картинки лежат в {1}, их можно заменить своими."
help.maps_failed: "Не удалось прочитать картинки справки, подробности в логе сервера."
help.chapter.capture.title: "Плен"
help.chapter.capture.1: "Постройте клетку из решёток, каменного кирпича, булыжника или обсидиана и поставьте внутрь магнетит. Поводок по цели в клетке или по магнетиту берёт в плен."
help.chapter.capture.2: "Пленный ходит по клетке. Вышел из клетки или клетку сломали — он свободен. В тюрьме клетка не держит: держат границы тюрьмы."
help.chapter.torture.title: "Пытки"
help.chapter.torture.1: "ПКМ оружием, огнивом, ведром воды или ядом по пленному — пытка. Shift+ПКМ открывает меню пленного: пытки без предмета, допрос, освобождение и казнь сломленного."
help.chapter.torture.2: "Сопротивление падает с каждой пыткой и восстанавливается, пока пленный в сети. Повтор одной пытки действует слабее."
help.chapter.escape.title: "Побег"
help.chapter.escape.1: "Пленному в наручниках раз в несколько минут приходит серия «прыжок, присед». Выполнил вовремя — шанс выскользнуть из наручников. Плен при этом остаётся."
help.chapter.escape.2: "Без наручников можно ломать стены клетки. Из тюрьмы бегут по-настоящему: найти слабое место и выйти за границы. Охрана, если видит, поднимет тревогу."
help.chapter.convoy.title: "Конвой"
help.chapter.convoy.1: "ПКМ поводком по пленному берёт его на поводок, повторный ПКМ отпускает. Отпущенный в клетке или в тюрьме остаётся там, иначе у вас 60 секунд вернуть его."
help.chapter.convoy.2: "Ведя пленного, нажмите ПКМ по лодке, вагонетке или лошади: он сядет и сам не слезет."
help.chapter.cuffs.title: "Наручники"
help.chapter.cuffs.1: "Наручники крафтятся на верстаке: цепь, железный слиток, цепь в ряд. Несколько раз ПКМ ими по пленному, стоя рядом. В наручниках нельзя ломать, ставить, бить, есть и выбрасывать."
help.chapter.cuffs.2: "Снять: тюремщик несколько раз ПКМ пустой рукой, наручники вернутся. Союзник может перекусить их ножницами."
help.chapter.prison.title: "Тюрьма"
help.chapter.prison.1: "Возьмите палку. ЛКМ по блоку — первый угол, ПКМ по блоку — второй. Shift+ПКМ в воздух — создать тюрьму, Shift+ЛКМ — сбросить. Границы видны частицами."
help.chapter.prison.2: "Shift+ПКМ палкой по кафедре в тюрьме делает её пультом. ПКМ по пульту открывает управление. Запасной путь: /torturemod prison."
help.chapter.prison.3: "Shift+ПКМ палкой по сундуку меняет его роль: сдача, награды, выкуп, склад, обычный."
help.chapter.prison.4: "Пленный ходит по всей тюрьме. Вышел за границы — свободен. Видел охранник — команде приходит тревога."
help.chapter.zones.title: "Зоны"
help.chapter.zones.1: "Разметьте палкой область внутри своей тюрьмы и Shift+ПКМ в воздух — это зона. В пульте у зоны имя, приоритет, норма и флаги: ломать, ставить, использовать, есть, бить, бросать."
help.chapter.zones.2: "Флаги действуют на пленного без наручников. Вне зон — флаги тюрьмы, по умолчанию только еда."
help.chapter.roles.title: "Роли"
help.chapter.roles.1: "Владелец может всё. Совладелец — всё, кроме удаления тюрьмы. Надзиратель пытает, ведёт, заковывает, допрашивает и подтверждает сделки."
help.chapter.roles.2: "В пульте можно создать свои роли и включить им права. Роли из привата (мэр, советник) сопоставляются в конфиге."
help.chapter.quota.title: "Норма"
help.chapter.quota.1: "В пульте положите образцы предметов: это норма за игровой день (20 минут онлайн). Пленный кладёт добычу в сундук сдачи."
help.chapter.quota.2: "За выполнение тюрьма может сократить срок, ускорить восстановление или дать вещи. Вещи приносит курьер или кто-то из команды."
help.chapter.ransom.title: "Выкуп"
help.chapter.ransom.1: "В меню пленного тюремщик ставит цену. Любой игрок открывает сундук выкупа, выбирает пленного и кладёт цену."
help.chapter.ransom.2: "Если тюрьма подтверждает сделки, оплата ждёт ответа. Отказ или сутки без ответа — залог можно забрать у того же сундука."
help.chapter.minions.title: "Мобы"
help.chapter.minions.1: "Сломленного моба в своей тюрьме можно подчинить оком Эндера. Сломленный голем служит сам."
help.chapter.minions.2: "Shift+ПКМ пустой рукой меняет режим: на посту, за мной, курьер. ПКМ бронёй или оружием — выдать снаряжение. Нежить без шлема горит."
help.chapter.minions.3: "Охрана атакует беглецов и тех, кто нападает на команду или помогает бежать. Сломленный житель торгует дешевле, фермер носит урожай в сундук."
help.chapter.admin.title: "Администратору"
help.chapter.admin.1: "/torturemod capture, release, list, reload, perf. /torturemod help maps выдаёт карты-иллюстрации для рамок."

