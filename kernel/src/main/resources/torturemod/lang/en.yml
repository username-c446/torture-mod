help.console: "The guide opens in game only."
help.book.title: "Torture Mod Guide"
help.book.contents: "Contents"
help.book.back: "‹ contents"
help.maps_given: "Maps given: {0}. Pictures are in {1}, you can replace them."
help.maps_failed: "Cannot read the guide pictures, see the server log."
help.chapter.capture.title: "Captivity"
help.chapter.capture.1: "Build a cage of iron bars, stone bricks, cobblestone or obsidian and put a lodestone inside. A lead on a target in the cage or on the lodestone captures."
help.chapter.capture.2: "A captive walks inside the cage. Leaving it or breaking it frees them. In a prison the cage does not matter: the prison borders hold."
help.chapter.torture.title: "Torture"
help.chapter.torture.1: "Right-click a captive with a weapon, flint and steel, water bucket or poison to torture. Shift+right-click opens the captive menu."
help.chapter.torture.2: "Resistance drops with each torture and recovers while the captive is online. Repeating one torture works less."
help.chapter.escape.title: "Escape"
help.chapter.escape.1: "A cuffed captive gets a jump/sneak sequence every few minutes. Done in time, it is a chance to slip out of the cuffs. Captivity stays."
help.chapter.escape.2: "Without cuffs you can break the cage walls. A prison is escaped for real: find a weak spot and leave its borders. Guards raise the alarm if they see you."
help.chapter.convoy.title: "Convoy"
help.chapter.convoy.1: "Right-click a captive with a lead to leash them, again to let go. Released in a cell or a prison, they stay; otherwise you have 60 seconds to return them."
help.chapter.convoy.2: "While leading, right-click a boat, minecart or horse: the captive sits and cannot get off."
help.chapter.cuffs.title: "Cuffs"
help.chapter.cuffs.1: "Craft cuffs: chain, iron ingot, chain in a row. Right-click a captive with them several times standing close. Cuffed, one cannot break, place, hit, eat or drop."
help.chapter.cuffs.2: "To remove: a jailer right-clicks several times with an empty hand, the cuffs return. An ally can cut them with shears."
help.chapter.prison.title: "Prison"
help.chapter.prison.1: "Take a stick. Left-click a block for corner 1, right-click a block for corner 2. Shift+right-click the air to create, Shift+left-click to reset."
help.chapter.prison.2: "Shift+right-click a lectern inside with the stick to make it a console. Right-click the console to manage. Also: /torturemod prison."
help.chapter.prison.3: "Shift+right-click a chest with the stick to change its role: deposit, rewards, ransom, warehouse, plain."
help.chapter.prison.4: "A captive walks the whole prison. Leaving its borders frees them. If a guard sees it, the team gets an alarm."
help.chapter.zones.title: "Zones"
help.chapter.zones.1: "Mark an area inside your prison and Shift+right-click the air: it is a zone. Its name, priority, quota and flags are in the console."
help.chapter.zones.2: "Flags apply to uncuffed captives. Outside zones the prison flags apply: only eating by default."
help.chapter.roles.title: "Roles"
help.chapter.roles.1: "The owner can do anything. A co-owner too, except deleting the prison. A warden tortures, leads, cuffs, interrogates and confirms deals."
help.chapter.roles.2: "Create your own roles in the console. Claim roles (mayor, assistant) are mapped in the config."
help.chapter.quota.title: "Quota"
help.chapter.quota.1: "Put sample items in the console: that is the quota per game day (20 minutes online). The captive puts loot into a deposit chest."
help.chapter.quota.2: "For a done quota the prison can cut the sentence, speed recovery or give items. Items are carried by a courier or the team."
help.chapter.ransom.title: "Ransom"
help.chapter.ransom.1: "A jailer sets a price in the captive menu. Any player opens the ransom chest, picks the captive and puts the price in."
help.chapter.ransom.2: "If the prison confirms deals, the payment waits for an answer. On refusal or after a day, take the deposit back at the same chest."
help.chapter.minions.title: "Mobs"
help.chapter.minions.1: "A broken mob in your prison can be controlled with an Eye of Ender. A broken golem serves by itself."
help.chapter.minions.2: "Shift+right-click with an empty hand changes the mode: post, follow, courier. Right-click with armor or a weapon to equip. Undead without a helmet burn."
help.chapter.minions.3: "Guards attack escapees and those who attack the team or help escape. A broken villager trades cheaper, a farmer brings crops to a chest."
help.chapter.admin.title: "Admins"
help.chapter.admin.1: "/torturemod capture, release, list, reload, perf. /torturemod help maps gives picture maps for item frames."

